name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    # Skip if the push was made by the bot (avoid infinite loop)
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # `main` requires pull requests and verified commits, so this workflow
      # must never try to push its generated file directly. Keep the preview
      # available for maintainers and let release PRs own repository changes.
      - name: Upload generated changelog preview
        uses: actions/upload-artifact@v4
        with:
          name: generated-changelog-${{ github.sha }}
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7
