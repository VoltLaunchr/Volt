name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  check:
    name: Check & Build
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux dependencies for Tauri)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify version manifests are aligned
        # Runs only once — version sync is platform-independent
        if: matrix.platform == 'ubuntu-latest'
        run: pnpm run check-version

      - name: Lint
        run: pnpm run lint

      - name: Build Frontend & Check Types
        run: pnpm run build

      - name: Frontend Tests (Vitest)
        run: pnpm run test

      - name: Rust Format Check
        run: cd src-tauri && cargo fmt --check

      - name: Rust Clippy
        run: cd src-tauri && cargo clippy --all-targets --features tantivy-search -- -D warnings

      - name: Check Rust Backend (Fast)
        run: cd src-tauri && cargo check --features tantivy-search

      - name: Rust Tests
        run: cd src-tauri && cargo test --workspace --lib --features tantivy-search

      - name: SQLCipher Clippy
        run: cd src-tauri && cargo clippy --all-targets --no-default-features --features sqlcipher -- -D warnings

      - name: SQLCipher Tests
        run: cd src-tauri && cargo test --workspace --lib --no-default-features --features sqlcipher

      - name: Verify generated TS bindings are up to date
        # The Rust test step regenerates the ts-rs IPC bindings; fail if they
        # drift from what's committed (fix: run `cargo test` and commit the
        # result). Linux only — single source of truth, avoids CRLF/LF noise.
        if: matrix.platform == 'ubuntu-latest'
        run: git diff --exit-code -- src/shared/types/generated
