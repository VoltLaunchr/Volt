packages:
  - .

allowBuilds:
  esbuild: true

# Security/transitive pins. pnpm 10+ reads `overrides` from this file, not the
# npm-style top-level `overrides` block in package.json.
overrides:
  fast-uri: '>=3.1.2'
  postcss: '>=8.5.10'
  picomatch: '>=4.0.4'
  flatted: '>=3.4.2'
  rollup: '>=4.59.0'
  esbuild: '>=0.28.1'
  # GHSA-22p9-wv53-3rq4: quadratic complexity in linkify-it match() (<=5.0.0),
  # pulled transitively by ansi-to-react. match() API is stable 3.x -> 5.x.
  linkify-it: '>=5.0.1'
