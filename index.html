<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Raleway:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Pre-paint backdrop. The Tauri window has `transparent: true`, so until
      React paints the .glass canvas the webview is see-through and the OS
      compositor leaks the desktop through. We paint the dark glass color on
      <body> straight from the HTML so the very first frame is opaque, then
      keep <html> + #root transparent so the rounded corners stay see-through.
      Once main.tsx imports global.css the same color is reapplied — visually
      identical, just earlier.

      The .splash element fills #root until React mounts and replaces it,
      so dev/cold-start delays show a centered logo instead of a dark void.
    -->
    <style>
      html, #root { background: transparent; }
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: rgba(20, 20, 30, 0.97);
        border-radius: 12px;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        opacity: 0;
        animation: splash-pulse 1.4s ease-in-out 0.15s infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50%      { opacity: 0.85; transform: scale(1);    }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="splash" aria-hidden="true">
        <svg class="splash-logo" viewBox="0 0 93 93" xmlns="http://www.w3.org/2000/svg">
          <path d="M46.6 25.7V47.2L41.7 44.4C33 39.4 27.6 30.1 27.6 20H24V44.6C24 52.6 28.6 60 35.9 63.5L46.7 68.7V47.2L51.6 50C60.3 55 65.7 64.3 65.7 74.4H69.3V49.8C69.3 41.8 64.7 34.4 57.4 30.9L46.6 25.7Z" fill="#8585e0"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
