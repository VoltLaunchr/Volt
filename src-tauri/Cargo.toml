[package]
name = "volt"
version = "0.3.0"
description = "Lightning-fast keyboard-driven launcher for Windows, macOS, and Linux"
authors = ["VoltLaunchr Contributors"]
license = "Apache-2.0"
homepage = "https://voltlaunchr.com"
repository = "https://github.com/VoltLaunchr/Volt"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "volt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
# Tauri features intentionally empty: devtools is gated to debug builds via the
# `devtools` feature below, and no other Tauri optional features are required.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
whoami = "1.5"
png = "0.17"
chrono = "0.4"
async-trait = "0.1"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
regex = "1.11"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
semver = "1.0"
arboard = "3.4"
# Bundling flavor is selected by Volt features (see [features] below), NOT here,
# so the default build keeps plain bundled SQLite while `--features sqlcipher`
# can swap in bundled SQLCipher. `libsqlite3-sys` links exactly one amalgamation,
# so `bundled` and `bundled-sqlcipher` are mutually exclusive by design.
rusqlite = { version = "0.40.1" }
fs4 = "0.13.1"
notify = { version = "6.1", features = ["macos_fsevent"] }
image = "0.25"
base64 = "0.22"
nucleo-matcher = "0.3"
# Rust→TS type generation (IPC contract sync). Bindings are emitted by the
# `export_bindings_*` tests into src/shared/types/generated/ and guarded by a
# vitest type test, so a Rust struct change that drifts from the frontend fails
# CI. serde-compat (default) honours #[serde(rename_all)].
ts-rs = "10"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
dotenvy = "0.15"
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
# Per-platform credential backends MUST be enabled explicitly. keyring v3
# made all platform backends opt-in: with no platform feature on, the crate
# falls back to a mock store that silently accepts writes and returns
# NoEntry on reads — auth and credential storage break completely without
# any error. Removing apple-native / windows-native here will reproduce
# that bug. sync-secret-service + crypto-rust cover Linux (D-Bus).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
unicode-normalization = "0.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
trash = "5.2.6"
thiserror = "2"
# Local embeddings for "Ask my notes" RAG. fastembed wraps ort + ONNX Runtime
# and ships pure-Rust tokenizers; the model itself is downloaded on first use
# to `app_data_dir/embeddings/` (NOT bundled into the binary). Uses native-tls
# by default — matches our existing reqwest config.
fastembed = "5"
# Pilier D Track 1: full-text/relevance file index. Pure-Rust, builds on
# Windows/macOS/Linux. OPTIONAL and OFF by default — only compiled when the
# `tantivy-search` feature is enabled, so the default build is unaffected.
# See REFONTE-PILIER-D-SEARCH.md.
tantivy = { version = "0.26", optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
# `ioapiset` (DeviceIoControl) + `errhandlingapi` (GetLastError) are required by
# the unprivileged USN change-journal reader (indexer::usn, feature
# `usn-incremental`). They are cheap and harmless when that feature is off.
winapi = { version = "0.3", features = ["shellapi", "winuser", "wingdi", "winnt", "winreg", "fileapi", "psapi", "processthreadsapi", "handleapi", "ioapiset", "errhandlingapi"] }
winreg = "0.55"
lnk = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.1"
plist = "1.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"

[features]
# Default keeps plain bundled SQLite — today's behavior, no new build deps.
default = ["bundled-sqlite"]
# Plain bundled SQLite (current behavior). Kept as an explicit feature so the
# bundling flavor is selected here rather than on the rusqlite dep line.
bundled-sqlite = ["rusqlite/bundled"]
# Pilier C — encrypted data-at-rest. Replaces plain SQLite with bundled
# SQLCipher + vendored OpenSSL (no system OpenSSL required, best for Windows).
# Implies `rusqlite/bundled-sqlcipher`. NOT in `default`: keeps the everyday
# build free of the OpenSSL/Perl toolchain until validated across CI. Build
# with: `cargo build --no-default-features --features sqlcipher` (do NOT combine
# with `bundled-sqlite` — the two bundlings conflict at the link step).
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
devtools = ["tauri/devtools"]
# Pilier D Track 1: enables the Tantivy-backed full-text file-search index
# (`indexer::fulltext`). OFF by default; the default build keeps the existing
# nucleo search path unchanged. See REFONTE-PILIER-D-SEARCH.md.
tantivy-search = ["dep:tantivy"]
# Pilier D Track 2 (no-admin): unprivileged USN change-journal delta reader
# (`indexer::usn`). Windows-only at runtime via FSCTL_READ_UNPRIVILEGED_USN_JOURNAL
# on a FILE_TRAVERSE handle — NO administrator privileges required. The record
# parser is pure and portable (unit-tested on any OS). OFF by default; not wired
# into the lifecycle yet (gated on the D1 benchmark GO). See REFONTE-PILIER-D-SEARCH.md §3.
usn-incremental = []
# Enables the heavy end-to-end embedding test that downloads the multilingual-e5-small
# model (~120 MB on first run, then cached). Run with:
#   cargo test --features test-embeddings -- --test-threads=1
# Kept off by default so CI and routine `cargo test` do not pull the model.
test-embeddings = []

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false
