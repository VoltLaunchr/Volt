[package]
name = "volt"
version = "0.2.1"
description = "Lightning-fast keyboard-driven launcher for Windows, macOS, and Linux"
authors = ["VoltLaunchr Contributors"]
license = "Apache-2.0"
homepage = "https://voltlaunchr.com"
repository = "https://github.com/VoltLaunchr/Volt"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "volt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
# Tauri features intentionally empty: devtools is gated to debug builds via the
# `devtools` feature below, and no other Tauri optional features are required.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
whoami = "1.5"
png = "0.17"
chrono = "0.4"
async-trait = "0.1"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.1"
regex = "1.11"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
semver = "1.0"
arboard = "3.4"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = { version = "6.1", features = ["macos_fsevent"] }
image = "0.25"
base64 = "0.22"
once_cell = "1.20"
nucleo-matcher = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
dotenvy = "0.15"
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
# Per-platform credential backends MUST be enabled explicitly. keyring v3
# made all platform backends opt-in: with no platform feature on, the crate
# falls back to a mock store that silently accepts writes and returns
# NoEntry on reads — auth and credential storage break completely without
# any error. Removing apple-native / windows-native here will reproduce
# that bug. sync-secret-service + crypto-rust cover Linux (D-Bus).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
hmac = "0.13"
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
unicode-normalization = "0.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
trash = "5.2.6"
thiserror = "2"
# Local embeddings for "Ask my notes" RAG. fastembed wraps ort + ONNX Runtime
# and ships pure-Rust tokenizers; the model itself is downloaded on first use
# to `app_data_dir/embeddings/` (NOT bundled into the binary). Uses native-tls
# by default — matches our existing reqwest config.
fastembed = "5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["shellapi", "winuser", "wingdi", "winnt", "winreg", "fileapi", "psapi", "processthreadsapi", "handleapi"] }
winreg = "0.55"
lnk = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.1"
plist = "1.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"

[features]
default = []
devtools = ["tauri/devtools"]
# Enables the heavy end-to-end embedding test that downloads the multilingual-e5-small
# model (~120 MB on first run, then cached). Run with:
#   cargo test --features test-embeddings -- --test-threads=1
# Kept off by default so CI and routine `cargo test` do not pull the model.
test-embeddings = []

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false
